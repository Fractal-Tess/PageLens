[workspace]
resolver = "3"
members = ["crates/*", "apps/tauri/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Fractal-Tess"]
license = "MIT"
repository = "https://github.com/Fractal-Tess/pagelens"

[workspace.dependencies]
# Internal crates
pagelens-core = { path = "crates/pagelens-core" }
pagelens-db = { path = "crates/pagelens-db" }
pagelens-app = { path = "crates/pagelens-app" }
pagelens-api = { path = "crates/pagelens-api" }
pagelens-logging = { path = "crates/pagelens-logging" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["sync"] }

# Browser automation
chromey = { version = "2.38", default-features = false, features = [
  "bytes",
  "default-tls",
  "serde0"
] }
getrandom = "=0.2.15"
uuid = { version = "1", features = ["v4", "serde"] }

axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls"
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Future crates (noted for later):
# pagelens-rules  — pluggable rule/check definitions
# pagelens-report — shared reporting & output formatting (JSON, HTML, scored summaries)
