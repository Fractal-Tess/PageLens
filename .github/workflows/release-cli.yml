name: Release CLI

on:
  push:
    tags:
      - cli-v*

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Validate CLI release tag
        run: nix develop .#default --command bash -lc './scripts/check-cli-release-tag.sh "${GITHUB_REF_NAME}"'

      - name: Install workspace dependencies
        run: nix develop .#default --command bash -lc 'bun install --frozen-lockfile'

      - name: Ensure tag commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "${DEFAULT_BRANCH}" --depth=1
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"

      - name: Run CLI tests
        run: nix develop .#default --command bash -lc 'cargo test -p pagelens-cli --tests'

      - name: Capture workspace version
        id: version
        run: echo "version=$(nix develop .#default --command bash -lc 'python3 scripts/get-workspace-version.py')" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_extension: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_extension: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        if: matrix.os == 'ubuntu-22.04'
        uses: cachix/install-nix-action@v31

      - name: Setup Bun
        if: matrix.os != 'ubuntu-22.04'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install Rust stable
        if: matrix.os != 'ubuntu-22.04'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install workspace dependencies in flake shell
        if: matrix.os == 'ubuntu-22.04'
        run: nix develop .#default --command bash -lc 'bun install --frozen-lockfile'

      - name: Install workspace dependencies natively
        if: matrix.os != 'ubuntu-22.04'
        run: bun install --frozen-lockfile

      - name: Build CLI binary in flake shell
        if: matrix.os == 'ubuntu-22.04'
        run: nix develop .#default --command bash -lc 'cargo build --locked --release -p pagelens-cli --bin pagelens --target ${{ matrix.target }}'

      - name: Build CLI binary natively
        if: matrix.os != 'ubuntu-22.04'
        run: cargo build --locked --release -p pagelens-cli --bin pagelens --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          archive_root="pagelens-v${VERSION}-${TARGET}"
          mkdir -p "$archive_root"
          cp "target/${TARGET}/release/pagelens" "$archive_root/"
          cp README.md LICENSE "$archive_root/"
          tar -czf "${archive_root}.tar.gz" "$archive_root"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $archiveRoot = "pagelens-v$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Path $archiveRoot | Out-Null
          Copy-Item "target/$env:TARGET/release/pagelens.exe" "$archiveRoot/pagelens.exe"
          Copy-Item "README.md" "$archiveRoot/README.md"
          Copy-Item "LICENSE" "$archiveRoot/LICENSE"
          Compress-Archive -Path $archiveRoot -DestinationPath "$archiveRoot.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            pagelens-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_extension }}

  release:
    needs: [validate, build]
    runs-on: ubuntu-22.04

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum pagelens-v${{ needs.validate.outputs.version }}-* > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PageLens CLI v${{ needs.validate.outputs.version }}
          body: |
            Automated release for the PageLens CLI.

            Assets:
            - Linux, macOS, and Windows binaries
            - SHA256 checksums in `SHA256SUMS`
          files: |
            dist/pagelens-v${{ needs.validate.outputs.version }}-*
            dist/SHA256SUMS
